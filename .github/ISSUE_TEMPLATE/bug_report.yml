name: Bug report
description: Something the server does that it should not, or fails to do.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Exploitable? Stop here** and use
        [private vulnerability reporting](https://github.com/jeonghun-app/auto-configuration-server/security/advisories/new)
        instead. That includes any way to read another subscriber's configuration,
        bypass an OTP or token check, or get a raw identifier into a log.

        **Do not paste a real IMSI, IMEI, MSISDN, OTP, provisioning token, admin
        token or DM password** anywhere in this issue, including inside logs, query
        strings and SyncML or `wap-provisioningdoc` bodies. Reproduce with
        identifiers from the reserved test network (MCC `001`, MNC `01`) and replace
        anything else with `<redacted>`. A real subscriber identifier in a public
        issue cannot be fully withdrawn once posted.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag (for example `v1.3.0`), an image tag, or a commit SHA.
    validations:
      required: true
  - type: dropdown
    id: plane
    attributes:
      label: Area
      options:
        - RCS configuration (RCC.14 / OMA-CP)
        - Device management (OMA-DM)
        - Admin API or operator console
        - SMS / OTP delivery
        - AWS deployment (CloudFormation, scripts)
        - Container image
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Store backend
      options:
        - memory
        - dynamodb (DynamoDB Local)
        - dynamodb (AWS)
        - not applicable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        The request(s) sent and the configuration used (`ACS_*` variables, with any
        secret replaced by `<redacted>`). Test-range identifiers only.
      placeholder: |
        1. ACS_ENV=dev ACS_STORE_BACKEND=memory ...
        2. curl 'http://127.0.0.1:8080/config?vers=0&IMSI=<MCC 001 test IMSI>&...'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: If a specification requires it, name the specification and clause; do not quote its text.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Status code, response body and log lines, with identifiers and secrets redacted.
      render: text
    validations:
      required: true
  - type: textarea
    id: client
    attributes:
      label: Client
      description: Handset or client, its RCS client version and the `rcs_profile` it requested, if relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: >-
            This issue contains no real IMSI, IMEI, MSISDN, OTP or token, and no
            secret from my deployment.
          required: true
