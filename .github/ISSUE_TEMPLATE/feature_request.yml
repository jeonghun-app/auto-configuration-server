name: Feature request
description: Propose a capability the server does not have.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [docs/limitations.md](https://github.com/jeonghun-app/auto-configuration-server/blob/main/docs/limitations.md)
        and [docs/scope.md](https://github.com/jeonghun-app/auto-configuration-server/blob/main/docs/scope.md)
        first: several gaps are already recorded there, with the reason they are open.

        A correction to a parameter's name, type or default against a specification
        you hold has its own template, **Specification correction**.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: >-
        What the server should do. If a specification defines it, name the
        specification, edition and clause; do not quote licensed text.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: impact
    attributes:
      label: Would this change what goes out on the wire?
      options:
        - "No"
        - "Yes: response codes or version semantics"
        - "Yes: provisioning parameters or management objects"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
