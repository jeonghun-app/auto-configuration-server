version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["pytest*", "ruff", "mypy", "moto", "cfn-lint", "types-*"]
    # FastAPI 0.142 records request query strings in OpenTelemetry spans
    # unredacted once an SDK is present; held until telemetry is disabled
    # explicitly (#29).
    ignore:
      - dependency-name: fastapi
        versions: [">=0.142"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The interpreter version is a project decision (requires-python, CI, mypy,
    # ruff and the Makefile move together), not a base-image bump. Patch digests
    # still arrive.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
