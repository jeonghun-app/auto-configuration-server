# Local development stack.
#
# The backing services are the AWS ones: DynamoDB runs as the official
# amazon/dynamodb-local image, so the same DynamoDbStore code path is exercised
# locally and in AWS. SMS is the mock provider because no AWS service can send
# the port-addressed binary SMS that RCC.14 wants for silent OTP delivery
# (see docs/limitations.md).
#
#   docker compose up --build -d
#   docker compose run --rm client-sim
#
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 | grep -q 400"]
      interval: 5s
      timeout: 3s
      retries: 10

  table-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name rcs-acs \
          --billing-mode PAY_PER_REQUEST \
          --attribute-definitions \
            AttributeName=pk,AttributeType=S \
            AttributeName=sk,AttributeType=S \
            AttributeName=gsi1pk,AttributeType=S \
            AttributeName=gsi1sk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
          --global-secondary-indexes '[{"IndexName":"gsi1","KeySchema":[{"AttributeName":"gsi1pk","KeyType":"HASH"},{"AttributeName":"gsi1sk","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
          2>/dev/null || echo "table already exists"
        aws dynamodb update-time-to-live --endpoint-url http://dynamodb:8000 \
          --table-name rcs-acs \
          --time-to-live-specification 'Enabled=true,AttributeName=expires_at' \
          2>/dev/null || true
        echo "table ready"

  acs:
    build: .
    depends_on:
      table-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ACS_ENV: dev
      ACS_LOG_LEVEL: INFO
      ACS_STORE_BACKEND: dynamodb
      ACS_TABLE_NAME: rcs-acs
      ACS_DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      ACS_AWS_REGION: ap-northeast-2
      ACS_SMS_PROVIDER: mock
      ACS_DEV_ENDPOINTS_ENABLED: "true"
      ACS_ADMIN_TOKEN: local-admin-token
      ACS_DEFAULT_RCS_PROFILE: UP_2.4
      ACS_DM_ENABLED: "true"
      ACS_DM_AUTH_SCHEME: basic
      ACS_DM_ACCOUNT_URI: http://localhost:8080/dm
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Seeds a demo subscriber and runs both client simulators end to end.
  client-sim:
    build: .
    depends_on:
      acs:
        condition: service_healthy
    environment:
      ACS_BASE_URL: http://acs:8080
      ACS_ADMIN_TOKEN: local-admin-token
    volumes:
      - ./tools:/app/tools:ro
      - ./scripts:/app/scripts:ro
    entrypoint: ["python", "/app/scripts/verify_stack.py"]
    profiles: ["verify"]
