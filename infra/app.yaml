AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GSMA RCS Auto Configuration Server on AWS. Every backing service is an AWS
  managed service: ECS Fargate for compute, Application Load Balancer for
  ingress, DynamoDB for state, Secrets Manager for the admin credential,
  CloudWatch Logs and CloudWatch metrics (via embedded metric format) for
  observability, and AWS End User Messaging SMS or Amazon SNS for OTP delivery,
  or an operator SMSC over SMPP for port-addressed OTP.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Container image }
        Parameters: [ImageUri]
      - Label: { default: Network and TLS }
        Parameters: [AllowedCidr, CertificateArn, VpcCidr, FixedEgress]
      - Label: { default: Service sizing }
        Parameters: [Environment, DesiredCount, MaxCount, TaskCpu, TaskMemory]
      - Label: { default: ACS behaviour }
        Parameters:
          - DefaultRcsProfile
          - ProvisioningValiditySeconds
          - SmsProvider
          - SmsOriginationIdentity
          - TrustedProxyCidrs
          - DmEnabled
      - Label: { default: Operator SMSC (SmsProvider=smpp) }
        Parameters:
          - SmppHost
          - SmppPort
          - SmppSystemId
          - SmppSystemType
          - SmppTls
          - SmppTlsCaSecretArn
          - SmppSmscCidr
          - SmppSourceAddr
          - SmppSourceAddrTon
          - SmppSourceAddrNpi
          - SmppDestAddrTon
          - SmppDestAddrNpi
          - SmppTimeoutSeconds
      - Label: { default: Observability and privacy }
        Parameters: [LogRetentionDays, PiiLogMode, AlbAccessLogBucket]

Parameters:
  ImageUri:
    Type: String
    Description: >
      Full image URI including the tag or digest, e.g.
      123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/rcs-acs:1.0.0

  AllowedCidr:
    Type: String
    Description: >
      CIDR permitted to reach the load balancer. Required. Use your own address
      range while testing; open it up only once you intend the ACS to be
      reachable by handsets.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'

  CertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN for the HTTPS listener. Leave empty for an HTTP-only
      deployment, which is acceptable for a demo but NOT for real handsets:
      RCC.14 configuration requests carry IMSI, IMEI, MSISDN, OTP and tokens.

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'

  FixedEgress:
    Type: String
    Default: none
    AllowedValues: [none, single, per-az]
    Description: >
      none = tasks reach the internet from their own public IPs, which change with
      every task replacement. single = one NAT gateway with an Elastic IP; the
      tasks move behind it and lose their public IPs, so an SMSC can allow-list
      one address (EgressIps output), but all egress stops if that one AZ fails.
      per-az = a NAT gateway and Elastic IP in each AZ: two addresses to
      allow-list, no single-AZ dependency, twice the NAT cost. See
      docs/aws-deployment.md for the cost.

  Environment:
    Type: String
    Default: prod
    AllowedValues: [staging, prod]

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20
    Description: Two tasks minimum in production so a deployment is not an outage.

  MaxCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100

  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048']

  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '4096']

  DefaultRcsProfile:
    Type: String
    Default: UP_2.4
    AllowedValues: [UP_2.4, UP_1.0, joyn_blackbird]

  ProvisioningValiditySeconds:
    Type: Number
    Default: 86400
    MinValue: 0
    Description: VALIDITY emitted in the OMA-CP VERS characteristic.

  SmsProvider:
    Type: String
    Default: eum
    AllowedValues: [eum, sns, smpp]
    Description: >
      eum = AWS End User Messaging SMS (recommended for text OTP), sns = Amazon
      SNS. Neither can send the port-addressed binary SMS that silent OTP delivery
      needs. smpp = an operator SMSC over SMPP 3.4, which can; it needs the Smpp*
      parameters and the password set in the SmppPasswordSecret output.

  SmsOriginationIdentity:
    Type: String
    Default: ''
    Description: AWS End User Messaging origination identity (phone number or pool ARN).

  SmppHost:
    Type: String
    Default: ''
    Description: Operator SMSC host name or address. Required when SmsProvider=smpp.

  SmppPort:
    Type: Number
    Default: 2775
    MinValue: 1
    MaxValue: 65535

  SmppSystemId:
    Type: String
    Default: ''
    MaxLength: 15
    Description: SMPP system_id issued by the operator. Required when SmsProvider=smpp.

  SmppTls:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      SMPP sends the password in clear. Set false only when the SMSC is reached
      over a private link.

  SmppSystemType:
    Type: String
    Default: ''
    MaxLength: 12
    AllowedPattern: '^[ -~]*$'
    Description: SMPP system_type, if the operator issued one. Usually empty.

  SmppTlsCaSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+-[A-Za-z0-9]{6}$'
    Description: >
      Complete ARN (with its random suffix) of a Secrets Manager secret you
      create, holding the operator's private CA bundle as plain PEM text. Empty
      (the default) trusts the public CAs in the image. Only the task execution
      role can read it, and only this one secret. Requires SmsProvider=smpp and
      SmppTls=true.

  # A String rather than a CommaDelimitedList: a template cannot count a list
  # without a transform, so with a list a fifth range would be silently dropped.
  # The pattern refuses it instead, and a single range, as 1.4.0 took, still fits.
  SmppSmscCidr:
    Type: String
    Default: ''
    AllowedPattern: '^$|^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])(,([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])){0,3}$'
    Description: >
      Address ranges of the SMSC, comma-separated without spaces, at most four
      (an SMSC pair needs two). The tasks may only open SmppPort to these ranges.
      Required when SmsProvider=smpp.

  SmppSourceAddr:
    Type: String
    Default: ''
    MaxLength: 20
    AllowedPattern: '^[ -~]*$'
    Description: >
      SMPP source_addr. Empty sends the sender id "RCS". SmppSourceAddrTon and
      SmppSourceAddrNpi must describe whichever is used.

  SmppSourceAddrTon:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 255
    Description: 5 = alphanumeric (the default sender id), 1 = international.

  SmppSourceAddrNpi:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 255
    Description: 0 = unknown, 1 = ISDN (E.164).

  SmppDestAddrTon:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 255
    Description: 1 = international; the destination is the E.164 MSISDN without "+".

  SmppDestAddrNpi:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 255
    Description: 1 = ISDN (E.164).

  SmppTimeoutSeconds:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 60
    Description: >
      Per SMSC response. The handset's HTTP request waits on it, so it is capped.

  TrustedProxyCidrs:
    Type: String
    Default: ''
    Description: >
      Comma-separated CIDRs of operator gateways allowed to assert a subscriber
      identity header. Empty disables header-enrichment identity entirely, which
      is the safe default: an identity header from an untrusted peer is forgeable.

  DmEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable the OMA-DM device management plane.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]

  PiiLogMode:
    Type: String
    Default: mask
    AllowedValues: [mask, hash]
    Description: How subscriber identifiers appear in logs. Never plaintext.

  AlbAccessLogBucket:
    Type: String
    Default: ''
    Description: >
      Name of an existing S3 bucket to write ALB access logs to. Empty (the
      default) disables access logging, which is deliberate: an ALB access log
      line records the full request line, and an RCC.14 request line contains
      IMSI, IMEI, MSISDN, OTP and token. Enabling this turns that bucket into a
      store of subscriber-identifying data, so you must create it yourself with a
      bucket policy permitting ELB log delivery and a retention rule you own.

Rules:
  SmppNeedsAnSmsc:
    RuleCondition: !Equals [!Ref SmsProvider, smpp]
    Assertions:
      - Assert: !Not [!Equals [!Ref SmppHost, '']]
        AssertDescription: SmsProvider=smpp requires SmppHost.
      - Assert: !Not [!Equals [!Ref SmppSystemId, '']]
        AssertDescription: SmsProvider=smpp requires SmppSystemId.
      - Assert: !Not [!Equals [!Ref SmppSmscCidr, '']]
        AssertDescription: SmsProvider=smpp requires SmppSmscCidr.
  SmppCaNeedsSmppOverTls:
    RuleCondition: !Not [!Equals [!Ref SmppTlsCaSecretArn, '']]
    Assertions:
      - Assert: !Equals [!Ref SmsProvider, smpp]
        AssertDescription: SmppTlsCaSecretArn is used only with SmsProvider=smpp.
      - Assert: !Equals [!Ref SmppTls, 'true']
        AssertDescription: SmppTlsCaSecretArn needs SmppTls=true; without TLS it would be ignored.

Conditions:
  UseSmpp: !Equals [!Ref SmsProvider, smpp]
  HasSmppTlsCa: !Not [!Equals [!Ref SmppTlsCaSecretArn, '']]
  # SmppSmscCidr padded so the second to fourth entries can be selected, as empty
  # strings, even when fewer ranges are given.
  HasSmscCidr2: !And
    - !Condition UseSmpp
    - !Not [!Equals [!Select [1, !Split [',', !Join ['', [!Ref SmppSmscCidr, ',,,']]]], '']]
  HasSmscCidr3: !And
    - !Condition UseSmpp
    - !Not [!Equals [!Select [2, !Split [',', !Join ['', [!Ref SmppSmscCidr, ',,,']]]], '']]
  HasSmscCidr4: !And
    - !Condition UseSmpp
    - !Not [!Equals [!Select [3, !Split [',', !Join ['', [!Ref SmppSmscCidr, ',,,']]]], '']]
  UseFixedEgress: !Not [!Equals [!Ref FixedEgress, none]]
  NatPerAz: !Equals [!Ref FixedEgress, per-az]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  WantAlbAccessLogs: !Not [!Equals [!Ref AlbAccessLogBucket, '']]

Resources:
  # ----------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-igw' }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-app-a' }]

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-app-b' }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-rt' }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  RouteAssociationPublicA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref RouteTable, SubnetId: !Ref PublicSubnetA }

  RouteAssociationPublicB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref RouteTable, SubnetId: !Ref PublicSubnetB }

  # With fixed egress the app subnets are moved, in place, onto route tables whose
  # default route is a NAT gateway, so they become private subnets. The table ID is
  # joined with the NAT route and split off again only to make the move wait for
  # that route: a bare Ref would move the subnet while the NAT gateway is still
  # being created, leaving the running tasks with no way out for minutes.
  RouteAssociationAppA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !If
        - UseFixedEgress
        - !Select [0, !Split ['|', !Join ['|', [!Ref PrivateRouteTableA, !Ref PrivateDefaultRouteA]]]]
        - !Ref RouteTable

  RouteAssociationAppB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !If
        - UseFixedEgress
        - !Select [0, !Split ['|', !Join ['|', [!Ref PrivateRouteTableB, !Ref PrivateDefaultRouteB]]]]
        - !Ref RouteTable

  # ---------------------------------------------------- fixed egress (optional)
  # The Elastic IPs are the addresses the operator's SMSC allow-lists. They are
  # released when FixedEgress goes back to none, or the stack is deleted, and an
  # address once released cannot be had back.
  EgressIpA:
    Type: AWS::EC2::EIP
    Condition: UseFixedEgress
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-egress-a' }]

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Condition: UseFixedEgress
    Properties:
      AllocationId: !GetAtt EgressIpA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nat-a' }]

  EgressIpB:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-egress-b' }]

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt EgressIpB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-nat-b' }]

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: UseFixedEgress
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-rt-a' }]

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Condition: UseFixedEgress
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  # With FixedEgress=single, AZ B also leaves through the NAT gateway in AZ A.
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: UseFixedEgress
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-rt-b' }]

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Condition: UseFixedEgress
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [NatPerAz, !Ref NatGatewayB, !Ref NatGatewayA]

  # Free, like the DynamoDB endpoint: ECR serves image layers from S3, and without
  # this every image pull would be billed per GB by the NAT gateway.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: UseFixedEgress
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTableA, !Ref PrivateRouteTableB]

  # Gateway endpoint: DynamoDB traffic never leaves the AWS network and costs
  # nothing, unlike an interface endpoint.
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds: !If
        - UseFixedEgress
        - [!Ref RouteTable, !Ref PrivateRouteTableA, !Ref PrivateRouteTableB]
        - [!Ref RouteTable]

  # ------------------------------------------------------- security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ingress to the ACS load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
          Description: HTTPS from the permitted range
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: HTTP (redirected to HTTPS when a certificate is configured)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref TaskSecurityGroup
          Description: To the ACS tasks only
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-alb-sg' }]

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ACS Fargate tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: AWS service APIs (DynamoDB, Secrets Manager, ECR, logs, SMS)
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-task-sg' }]

  # One rule per SmppSmscCidr entry, up to the four its pattern admits. The first
  # keeps its 1.4.0 logical ID so an existing stack updates it in place.
  TaskEgressToSmsc:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: UseSmpp
    # cfn-lint resolves SmppSmscCidr to its empty default, but this resource only
    # exists with SmsProvider=smpp, where the SmppNeedsAnSmsc rule requires a value.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1035]
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref SmppPort
      ToPort: !Ref SmppPort
      CidrIp: !Select [0, !Split [',', !Ref SmppSmscCidr]]
      Description: SMPP to the operator SMSC

  TaskEgressToSmsc2:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasSmscCidr2
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref SmppPort
      ToPort: !Ref SmppPort
      CidrIp: !Select [1, !Split [',', !Ref SmppSmscCidr]]
      Description: SMPP to the operator SMSC (second range)

  TaskEgressToSmsc3:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasSmscCidr3
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref SmppPort
      ToPort: !Ref SmppPort
      CidrIp: !Select [2, !Split [',', !Ref SmppSmscCidr]]
      Description: SMPP to the operator SMSC (third range)

  TaskEgressToSmsc4:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasSmscCidr4
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref SmppPort
      ToPort: !Ref SmppPort
      CidrIp: !Select [3, !Split [',', !Ref SmppSmscCidr]]
      Description: SMPP to the operator SMSC (fourth range)

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Only the load balancer may reach the tasks

  # -------------------------------------------------------------- data store
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-acs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      # OTP challenges and DM sessions expire themselves; no cleanup job.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags: [{ Key: Application, Value: rcs-acs }]

  AdminTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/admin-token'
      Description: Bearer token for the ACS admin API
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        IncludeSpace: false

  PiiHashSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/pii-hash-secret'
      Description: HMAC key used to pseudonymise subscriber identifiers in logs
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        IncludeSpace: false

  # The SMSC password is issued by the operator, so it cannot be generated here.
  # The random placeholder (SMPP passwords are at most 8 characters) keeps the
  # task startable and makes every bind fail, answering 503, until the real value
  # is put into the secret and the service is redeployed.
  SmppPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseSmpp
    Properties:
      Name: !Sub '${AWS::StackName}/smpp-password'
      Description: SMPP password for the operator SMSC (replace the placeholder)
      GenerateSecretString:
        PasswordLength: 8
        ExcludePunctuation: true
        IncludeSpace: false

  # ------------------------------------------------------------------- roles
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-startup-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref AdminTokenSecret
                  - !Ref PiiHashSecret
                  - !If [UseSmpp, !Ref SmppPasswordSecret, !Ref AWS::NoValue]
                  # Created by the operator, not this stack, so the grant names the
                  # one ARN given and nothing else. A customer-managed KMS key on
                  # that secret also needs kms:Decrypt for this role in its key policy.
                  - !If [HasSmppTlsCa, !Ref SmppTlsCaSecretArn, !Ref AWS::NoValue]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        # Scoped to the one table and its one index. No wildcard resources.
        - PolicyName: acs-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub '${Table.Arn}/index/gsi1'
        # Sending an SMS to a phone number has no resource ARN to scope to, so
        # the permission is narrowed to these two actions, and withheld entirely
        # when the SMSC carries the OTP instead.
        - !If
          - UseSmpp
          - !Ref AWS::NoValue
          - PolicyName: acs-sms-send
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sms-voice:SendTextMessage
                    - sns:Publish
                  Resource: '*'

  # ---------------------------------------------------------------- logging
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ecs/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '60' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        # AWS::NoValue removes a whole list *element*; it does not remove a nested
        # value, so each attribute must be conditional in its own right.
        # Supplying access_logs.s3.bucket as an empty string is rejected by the
        # ELB API outright.
        - !If
          - WantAlbAccessLogs
          - { Key: access_logs.s3.enabled, Value: 'true' }
          - !Ref 'AWS::NoValue'
        - !If
          - WantAlbAccessLogs
          - { Key: access_logs.s3.bucket, Value: !Ref AlbAccessLogBucket }
          - !Ref 'AWS::NoValue'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      # The shallow liveness endpoint, which makes no AWS calls: a dependency
      # hiccup must not deregister healthy tasks.
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '20' }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        !If
          - HasCertificate
          - - Type: redirect
              RedirectConfig:
                Protocol: HTTPS
                Port: '443'
                StatusCode: HTTP_301
          - - Type: forward
              TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------------ compute
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-acs'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: acs
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: acs
          Environment:
            - { Name: ACS_ENV, Value: !Ref Environment }
            - { Name: ACS_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: ACS_STORE_BACKEND, Value: dynamodb }
            - { Name: ACS_TABLE_NAME, Value: !Ref Table }
            - { Name: ACS_SMS_PROVIDER, Value: !Ref SmsProvider }
            - { Name: ACS_SMS_ORIGINATION_IDENTITY, Value: !Ref SmsOriginationIdentity }
            - { Name: ACS_SMPP_HOST, Value: !Ref SmppHost }
            - { Name: ACS_SMPP_PORT, Value: !Ref SmppPort }
            - { Name: ACS_SMPP_SYSTEM_ID, Value: !Ref SmppSystemId }
            - { Name: ACS_SMPP_SYSTEM_TYPE, Value: !Ref SmppSystemType }
            - { Name: ACS_SMPP_TLS, Value: !Ref SmppTls }
            - { Name: ACS_SMPP_SOURCE_ADDR, Value: !Ref SmppSourceAddr }
            - { Name: ACS_SMPP_SOURCE_ADDR_TON, Value: !Ref SmppSourceAddrTon }
            - { Name: ACS_SMPP_SOURCE_ADDR_NPI, Value: !Ref SmppSourceAddrNpi }
            - { Name: ACS_SMPP_DEST_ADDR_TON, Value: !Ref SmppDestAddrTon }
            - { Name: ACS_SMPP_DEST_ADDR_NPI, Value: !Ref SmppDestAddrNpi }
            - { Name: ACS_SMPP_TIMEOUT_SECONDS, Value: !Ref SmppTimeoutSeconds }
            - { Name: ACS_DEFAULT_RCS_PROFILE, Value: !Ref DefaultRcsProfile }
            - { Name: ACS_PROVISIONING_VALIDITY_SECONDS, Value: !Ref ProvisioningValiditySeconds }
            - { Name: ACS_TRUSTED_PROXY_CIDRS, Value: !Ref TrustedProxyCidrs }
            - { Name: ACS_DM_ENABLED, Value: !Ref DmEnabled }
            - { Name: ACS_PII_LOG_MODE, Value: !Ref PiiLogMode }
            - { Name: ACS_DEV_ENDPOINTS_ENABLED, Value: 'false' }
            - { Name: ACS_METRICS_NAMESPACE, Value: RcsAcs }
            - Name: ACS_DM_ACCOUNT_URI
              Value: !If
                - HasCertificate
                - !Sub 'https://${LoadBalancer.DNSName}/dm'
                - !Sub 'http://${LoadBalancer.DNSName}/dm'
          Secrets:
            - { Name: ACS_ADMIN_TOKEN, ValueFrom: !Ref AdminTokenSecret }
            - { Name: ACS_PII_HASH_SECRET, ValueFrom: !Ref PiiHashSecret }
            - !If
              - UseSmpp
              - { Name: ACS_SMPP_PASSWORD, ValueFrom: !Ref SmppPasswordSecret }
              - !Ref AWS::NoValue
            # PEM text rather than a file, because the root filesystem is read-only.
            - !If
              - HasSmppTlsCa
              - { Name: ACS_SMPP_TLS_CA_PEM, ValueFrom: !Ref SmppTlsCaSecretArn }
              - !Ref AWS::NoValue

  Service:
    Type: AWS::ECS::Service
    # The route table associations: with fixed egress, a task without a public IP
    # must not start before its subnet routes through the NAT gateway, or it cannot
    # pull its image.
    DependsOn: [HttpListener, TaskIngressFromAlb, RouteAssociationAppA, RouteAssociationAppB]
    Properties:
      ServiceName: !Sub '${AWS::StackName}-service'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      # Fargate cold start plus catalogue validation; be generous so a slow first
      # boot is not mistaken for an unhealthy task.
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Without fixed egress, public IPs are required to pull from ECR without a
          # NAT gateway. No inbound rule permits anything except the load balancer,
          # so the tasks are not reachable from the internet either way.
          AssignPublicIp: !If [UseFixedEgress, DISABLED, ENABLED]
          Subnets: [!Ref AppSubnetA, !Ref AppSubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: acs
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      MinCapacity: !Ref DesiredCount
      MaxCapacity: !Ref MaxCount
      # RoleARN is deliberately omitted: Application Auto Scaling uses its own
      # service-linked role, and naming it explicitly fails on an account where
      # that role has not been created yet.

  RequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-requests-per-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        # Provisioning traffic is bursty (fleet reboots, validity expiry storms),
        # so scale on request rate rather than CPU.
        TargetValue: 600
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${LoadBalancer.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}'
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ------------------------------------------------------------------ alarms
  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-unhealthy-targets'
      AlarmDescription: One or more ACS tasks are failing their health check.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-5xx'
      AlarmDescription: The ACS is returning server errors.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  OtpVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-otp-volume'
      AlarmDescription: >
        Unusual OTP send volume. An open OTP endpoint is a direct financial
        attack: the attacker triggers SMS that the operator pays for.
      Namespace: RcsAcs
      MetricName: OtpSent
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  LoadBalancerDns:
    Description: Public DNS name of the ACS load balancer.
    Value: !GetAtt LoadBalancer.DNSName

  BaseUrl:
    Description: Base URL for the configuration endpoint.
    Value: !If
      - HasCertificate
      - !Sub 'https://${LoadBalancer.DNSName}'
      - !Sub 'http://${LoadBalancer.DNSName}'

  ConfigurationEndpoint:
    Description: RCC.14 configuration endpoint.
    Value: !If
      - HasCertificate
      - !Sub 'https://${LoadBalancer.DNSName}/config'
      - !Sub 'http://${LoadBalancer.DNSName}/config'

  DmEndpoint:
    Description: OMA-DM SyncML endpoint.
    Value: !If
      - HasCertificate
      - !Sub 'https://${LoadBalancer.DNSName}/dm'
      - !Sub 'http://${LoadBalancer.DNSName}/dm'

  AdminTokenSecretArn:
    Description: Secrets Manager ARN holding the admin API bearer token.
    Value: !Ref AdminTokenSecret

  SmppPasswordSecretArn:
    Condition: UseSmpp
    Description: >
      Secrets Manager ARN for the SMSC password. Put the operator-issued value,
      then force a new deployment of the service so the tasks read it.
    Value: !Ref SmppPasswordSecret

  EgressIps:
    Condition: UseFixedEgress
    Description: >
      Fixed source addresses of all task egress, SMPP included. Give these to the
      operator for the SMSC allow-list.
    Value: !If
      - NatPerAz
      - !Join [',', [!Ref EgressIpA, !Ref EgressIpB]]
      - !Ref EgressIpA

  TableName:
    Description: DynamoDB table backing the ACS.
    Value: !Ref Table

  LogGroupName:
    Description: CloudWatch log group.
    Value: !Ref LogGroup

  OperatorDnsGuidance:
    Description: >
      An RCS client resolves its ACS from the SIM's MCC/MNC. Point
      config.rcs.mnc<MNC>.mcc<MCC>.pub.3gppnetwork.org at this load balancer, with
      a certificate covering that name, for real handsets to find it.
    Value: !Sub 'CNAME config.rcs.mncXXX.mccYYY.pub.3gppnetwork.org -> ${LoadBalancer.DNSName}'
