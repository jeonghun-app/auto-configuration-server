[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rcs-acs"
version = "1.2.0"
description = "GSMA RCS Auto Configuration Server (RCC.14 / RCC.07 OMA-CP) with an extensible OMA-DM device management plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "jeonghun-app" }]
keywords = ["gsma", "rcs", "acs", "oma-cp", "oma-dm", "volte", "provisioning", "aws"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://github.com/jeonghun-app/auto-configuration-server"
Issues = "https://github.com/jeonghun-app/auto-configuration-server/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acs = ["catalog/**/*.yaml", "schemas/*.dtd", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "spec: test is traceable to a named specification clause",
  "aws: test exercises an AWS SDK path via moto",
]

[tool.coverage.run]
branch = true
source = ["acs"]
omit = ["*/sms/smpp.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@typing.overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "T20"]
# N818 (exception names must end in "Error"): the domain exceptions are named
# after the RCC.14 outcomes they represent (MalformedRequest, IdentityUnresolved,
# OtpChallengeIssued), which reads better at the call site than an Error suffix.
# N815/N803/N806: specification parameter names are mixed case on the wire and
# must be spelled exactly as the standard spells them.
ignore = ["B008", "N815", "N803", "N806", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "T20"]
"tools/*" = ["T20"]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["botocore.*", "boto3.*", "lxml.*"]
ignore_missing_imports = true
