# GSMA RCS provisioning parameter catalogue — base set.
#
# Every parameter the ACS can emit is declared here exactly once.
#
#   path      slash-separated characteristic path. A leading "APPLICATION:<id>"
#             selects the APPLICATION characteristic carrying that AppID.
#   parm      parameter name, spelled as the specification spells it. Casing is
#             NOT normalised: clients compare these names exactly.
#   type      chr | int | bool01 | enum
#   default   value, may contain {placeholders} resolved per subscriber
#   spec      informative reference
#   verified  true only when the entry has been cross-checked against the
#             pinned specification edition (see docs/spec-coverage.md)
#
# Placeholders: {imsi} {msisdn} {msisdn_national} {mcc} {mnc} {ims_domain}
#               {impi} {impu} {device_id} {acs_host}
#
# NOTE ON HONESTY: entries marked verified:false are implemented from public
# descriptions of RCC.07/RCC.14 and widely deployed operator configurations.
# They are structurally correct and testable, but the repository does not claim
# clause-level certification for them. See docs/spec-coverage.md.

meta:
  id: base
  title: GSMA RCS base provisioning catalogue
  spec: GSMA RCC.14 (Service Provider Device Configuration) + RCC.07 (RCS client)
  oma_cp_version: "1.1"

entries:

  # ======================================================================
  # ap2001 — IMS application (3GPP IMS Management Object, TS 24.167)
  # ======================================================================
  - path: APPLICATION:ap2001
    parm: Name
    type: chr
    default: IMS Settings
    spec: OMA-CP 1.1 / RCC.14 IMS application
    verified: true
    required: true
    doc: Human readable application name.

  - path: APPLICATION:ap2001
    parm: Private_User_Identity
    type: chr
    default: "{impi}"
    spec: 3GPP TS 24.167 5.2.2
    verified: true
    required: true
    doc: IMPI derived from the IMSI.

  - path: APPLICATION:ap2001
    parm: Home_network_domain_name
    type: chr
    default: "{ims_domain}"
    spec: 3GPP TS 24.167 5.2.4
    verified: true
    required: true

  - path: APPLICATION:ap2001
    parm: Authentication_Type
    type: enum
    values: ["EarlyIMS", "Digest", "AKA"]
    default: AKA
    spec: 3GPP TS 24.167 5.2.7
    verified: true

  - path: APPLICATION:ap2001
    parm: UserName
    type: chr
    default: "{impi}"
    spec: 3GPP TS 24.167 5.2.7.1
    verified: false
    doc: Digest username; only meaningful when Authentication_Type is Digest.

  - path: APPLICATION:ap2001
    parm: Timer_T1
    type: int
    unit: ms
    default: "2000"
    spec: 3GPP TS 24.167 5.2.9
    verified: false

  - path: APPLICATION:ap2001
    parm: Timer_T2
    type: int
    unit: ms
    default: "16000"
    spec: 3GPP TS 24.167 5.2.10
    verified: false

  - path: APPLICATION:ap2001
    parm: Timer_T4
    type: int
    unit: ms
    default: "17000"
    spec: 3GPP TS 24.167 5.2.11
    verified: false

  - path: APPLICATION:ap2001
    parm: Phone_Context
    type: chr
    default: "{ims_domain}"
    spec: 3GPP TS 24.167 5.2.13
    verified: false

  - path: APPLICATION:ap2001
    parm: PDP_ContextOperPref
    type: bool01
    default: "0"
    spec: 3GPP TS 24.167 5.2.8
    verified: false

  - path: APPLICATION:ap2001
    parm: Resource_Allocation_Mode
    type: bool01
    default: "0"
    spec: 3GPP TS 24.167 5.2.12
    verified: false

  - path: APPLICATION:ap2001
    parm: Voice_Domain_Preference_E_UTRAN
    type: enum
    values: ["1", "2", "3", "4"]
    default: "3"
    spec: 3GPP TS 24.167 5.2.16 (VoLTE domain selection)
    verified: false
    doc: 1 CS only, 2 IMS PS preferred, 3 CS voice preferred/IMS secondary, 4 IMS only.

  - path: APPLICATION:ap2001
    parm: SMS_Over_IP_Networks_Indication
    type: bool01
    default: "1"
    spec: 3GPP TS 24.167 5.2.17
    verified: false
    doc: SMS over IMS (SMSoIP) — required for a full VoLTE profile.

  - path: APPLICATION:ap2001
    parm: Keep_Alive_Enabled
    type: bool01
    default: "1"
    spec: 3GPP TS 24.167 5.2.18
    verified: false

  - path: APPLICATION:ap2001/Public_User_Identity_List/Public_User_Identity
    parm: Public_User_Identity
    type: chr
    default: "{impu}"
    spec: 3GPP TS 24.167 5.2.3
    verified: true
    required: true

  - path: APPLICATION:ap2001/LBO_P-CSCF_Address
    parm: Address
    type: chr
    default: "pcscf.{ims_domain}"
    spec: 3GPP TS 24.167 5.2.5
    verified: true
    required: true

  - path: APPLICATION:ap2001/LBO_P-CSCF_Address
    parm: AddressType
    type: enum
    values: ["FQDN", "IPv4", "IPv6"]
    default: FQDN
    spec: 3GPP TS 24.167 5.2.6
