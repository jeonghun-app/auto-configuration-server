    verified: false

  - path: APPLICATION:ap2001/Ext/GSMA
    parm: AppRef
    type: chr
    default: IMS-Settings
    spec: RCC.07 IMS/RCS application linkage
    verified: false

  - path: APPLICATION:ap2001/Ext/GSMA
