    type: bool01
    default: "1"
    spec: RCC.07 Single Registration (RCS over VoLTE IMS registration)
    verified: false
    doc: 1 = RCS shares the VoLTE IMS registration instead of registering twice.

  - path: APPLICATION:ap2001/Ext/NAT
